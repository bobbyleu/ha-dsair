name: Auto Release

# 每次推送到默认分支后，按 manifest.json 中的版本号自动创建 tag 并发布 Release。
# 版本号未变（tag 已存在）时跳过，避免重复发布；也支持手动推送 v* tag 或手动触发。
on:
  push:
    branches:
      - test
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read integration version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('custom_components/ds_air/manifest.json', encoding='utf-8'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Integration version: $VERSION"

      - name: Check whether tag already exists
        id: check
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "Tag push event: publish release directly."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag v${{ steps.version.outputs.version }} already exists; skip duplicate release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: steps.check.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
